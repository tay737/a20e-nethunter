name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/0006-*'

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential bc bison flex libssl-dev \
            libelf-dev cpio kmod zip xz-utils python3 gcc-aarch64-linux-gnu clang lld llvm
          aarch64-linux-gnu-gcc --version | head -1
          clang --version | head -1

      - name: Fetch Eureka R15-AOSP kernel
        run: |
          git clone --depth 1 --branch R15-AOSP \
            https://github.com/eurekadevelopment/Eureka-Kernel.git ksrc
          cd ksrc
          git rev-parse --short HEAD

      - name: Pin KernelSU v0.9.4
        run: |
          cd ksrc
          rm -rf KernelSU
          git clone --depth 1 --branch v0.9.4 https://github.com/tiann/KernelSU.git KernelSU
          ls KernelSU/kernel | head
          test -L drivers/kernelsu || ln -sfn ../KernelSU/kernel drivers/kernelsu

      - name: Apply the USB HID gadget patch
        run: |
          cd ksrc
          patch -p1 --forward < "$GITHUB_WORKSPACE/patches/0006-usb-gadget-bind-linked-functions.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/patches/0007-f-hid-fix-spinlock-name.patch"
          grep -n "Attach whatever configfs linked" drivers/usb/gadget/configfs.c
          patch -p1 --forward < "$GITHUB_WORKSPACE/patches/0008-bluetooth-l2cap-hold-unless-zero.patch"
          grep -n "spin_lock_irqsave(&hidg->spinlock, flags)" drivers/usb/gadget/function/f_hid.c | tail -2
          grep -n "l2cap_chan_hold_unless_zero" net/bluetooth/l2cap_core.c

      - name: Configure
        run: |
          cd ksrc
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=12
          # start from the config the working kernel on the device was built with
          mkdir -p out
          cp "$GITHUB_WORKSPACE/build-configs/a20e-working.config" out/.config
          # these Eureka-only int symbols have no default and would prompt
          grep -q '^CONFIG_LITTLE_CPU_MASK=' out/.config || echo 'CONFIG_LITTLE_CPU_MASK=0' >> out/.config
          grep -q '^CONFIG_BIG_CPU_MASK=' out/.config || echo 'CONFIG_BIG_CPU_MASK=0' >> out/.config
          yes "" | make O=out ARCH=arm64 olddefconfig
          for opt in USB_CONFIGFS_F_HID OVERLAY_FS BT BT_HCIVHCI RFKILL; do
            scripts/config --file out/.config -e "$opt" || true
          done
          for opt in LTO_CLANG THINLTO LLVM_POLLY CFI_CLANG CFI; do
            scripts/config --file out/.config -d "$opt" || true
          done
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(LTO|THINLTO|LLVM_POLLY|KSU)" out/.config || echo "lto/ksu symbols off" 
          for opt in KSU USB_CONFIGFS_F_HID USB_CONFIGFS_UEVENT; do
            printf '%-28s %s\n' "$opt" "$(grep -E "^CONFIG_${opt}=" out/.config || echo MISSING)"
          done

      - name: Build Image
        run: |
          cd ksrc
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=12
          set +e
          make -j"$(nproc)" O=out ARCH=arm64 Image \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- > /tmp/build.log 2>&1
          rc=$?
          echo "make exit=$rc"
          grep -nE "error:|fatal error:|undefined reference|Error [0-9]" /tmp/build.log | head -30
          if [ $rc -ne 0 ]; then tail -60 /tmp/build.log; fi
          exit $rc
          ls -lL out/arch/arm64/boot/Image

      - uses: actions/upload-artifact@v4
        with:
          name: Image-r15-hid
          path: ksrc/out/arch/arm64/boot/Image
          if-no-files-found: error
